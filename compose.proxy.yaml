# Optional trusted build CA for corporate/managed TLS proxies.
# BUILD_CA_FILE=/path/to/trusted-ca.crt docker compose -f compose.yaml -f compose.proxy.yaml build
services:
  migrate:
    build:
      secrets:
        - npm_ca
secrets:
  npm_ca:
    file: ${BUILD_CA_FILE:?Set BUILD_CA_FILE to a trusted CA certificate bundle}
