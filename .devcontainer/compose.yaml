services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: scheduler
      POSTGRES_DB: scheduler
    volumes:
      - dev-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduler -d scheduler"]
      interval: 2s
      timeout: 3s
      retries: 30
  workspace:
    build:
      context: ..
      dockerfile: Dockerfile
      target: development
    init: true
    environment:
      DATABASE_URL: postgres://scheduler:scheduler@db:5432/scheduler
      HOST: 0.0.0.0
      PORT: 3000
    volumes:
      - ..:/app:cached
      - dev-node-modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
volumes:
  dev-db:
  dev-node-modules:
