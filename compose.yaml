services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: scheduler
      POSTGRES_DB: scheduler
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - scheduler-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduler -d scheduler"]
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    image: keyloop-scheduler:local
    build: .
    command: ["node", "dist/db/cli.js", "migrate"]
    environment:
      DATABASE_URL: postgres://scheduler:scheduler@db:5432/scheduler
    depends_on:
      db:
        condition: service_healthy
  api:
    image: keyloop-scheduler:local
    pull_policy: never
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: postgres://scheduler:scheduler@db:5432/scheduler
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 15
volumes:
  scheduler-db:
